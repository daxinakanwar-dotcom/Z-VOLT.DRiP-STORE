<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-VOLT DRIP STORE | Premium</title>
    
    <!-- Ultra Modern Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* बेस थीम और कस्टम कर्सर */
        body {
            margin: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            cursor: crosshair;
        }

        /* ---------------- SIGN IN / LOG IN SCREEN ---------------- */
        #auth-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }
        .auth-box {
            text-align: center;
            padding: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            background: linear-gradient(145deg, #0a0a0a, #111);
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        .auth-box h1 {
            font-family: 'Syncopate', sans-serif;
            font-size: 28px;
            letter-spacing: 4px;
            margin-bottom: 30px;
            text-transform: uppercase;
            color: #ff6600;
        }
        .auth-input {
            width: 100%;
            padding: 15px 0;
            background: transparent;
            border: none;
            border-bottom: 2px solid #333;
            color: white;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
            font-family: 'Outfit', sans-serif;
            text-align: center;
            transition: 0.3s;
        }
        .auth-input:focus { border-bottom-color: #ff6600; }
        .enter-btn {
            padding: 15px 40px;
            background: #ff6600;
            color: #000;
            border: none;
            font-family: 'Syncopate', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.4s;
            margin-top: 20px;
            border-radius: 5px;
        }
        .enter-btn:hover {
            background: #fff;
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.5);
        }

        /* ---------------- MAIN STORE (Hidden Initially) ---------------- */
        #main-store {
            display: none;
            animation: fadeIn 1s ease forwards;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* बैकग्राउंड स्टार्स (ऑरेंज और वाइट मिक्स) */
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle infinite alternate;
            z-index: -1;
            opacity: 0.3;
        }
        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(0.8); }
            100% { opacity: 0.8; transform: scale(1.5); box-shadow: 0 0 10px #ff6600; }
        }

        /* स्क्रॉलिंग पट्टी */
        .marquee-container {
            width: 100%; background: #ff6600; color: #000; padding: 10px 0;
            overflow: hidden; white-space: nowrap; font-family: 'Syncopate', sans-serif;
            font-size: 12px; letter-spacing: 2px; position: fixed; top: 0; z-index: 1000;
            font-weight: bold;
        }
        .marquee-text { display: inline-block; animation: scrollMarquee 15s linear infinite; }
        @keyframes scrollMarquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* हीरो सेक्शन (आपकी दूसरी फोटो के साथ) */
        .hero {
            height: 60vh; display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center; margin-top: 40px;
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.9)), url('IMG_20260904_152818.png');
            background-size: cover;
            background-position: center;
            border-bottom: 2px solid #ff6600;
        }
        .hero h1 {
            font-family: 'Syncopate', sans-serif; font-size: 8vw; margin: 0;
            color: transparent; -webkit-text-stroke: 2px #ff6600;
            transition: 0.5s; cursor: pointer; text-transform: uppercase;
        }
        .hero h1:hover { color: #ff6600; text-shadow: 0 0 40px rgba(255, 102, 0, 0.6); }

        /* प्रोडक्ट सेक्शन */
        .product-container {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 50px; padding: 40px 20px;
        }
        .product-card {
            width: 320px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 102, 0, 0.2);
            border-radius: 15px; padding: 20px; backdrop-filter: blur(10px);
            transition: all 0.4s ease; text-align: left;
        }
        .product-card:hover { transform: translateY(-10px); border-color: #ff6600; box-shadow: 0 10px 30px rgba(255,102,0,0.2);}
        .product-img-box {
            width: 100%; height: 380px; overflow: hidden; border-radius: 10px; margin-bottom: 20px;
            background: #000;
        }
        .product-img { width: 100%; height: 100%; object-fit: cover; transition: 0.6s ease; }
        .product-card:hover .product-img { transform: scale(1.08); filter: brightness(1.1); }
        
        .product-title { font-size: 22px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;}
        .product-price { font-size: 20px; color: #ff6600; margin-bottom: 15px; font-weight: bold;}

        /* ---------------- एस्थेटिक साइज चार्ट (आपकी PNG के साथ) ---------------- */
        .size-btn {
            width: 100%; background: transparent; color: #fff; border: 1px solid #444;
            padding: 10px; font-family: 'Outfit', sans-serif; font-size: 12px; letter-spacing: 2px;
            text-transform: uppercase; cursor: pointer; transition: 0.3s;
            display: flex; justify-content: space-between; align-items: center;
            border-radius: 5px;
        }
        .size-btn:hover { background: #ff6600; color: #000; border-color: #ff6600; }
        
        .size-chart-content {
            max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out;
            background: transparent; margin-top: 10px;
        }
        .size-chart-content.active { max-height: 400px; }
        .size-chart-img {
            width: 100%; border-radius: 8px; border: 1px solid #ff6600;
        }

        /* ---------------- चेकआउट फॉर्म (UNTOUCHED) ---------------- */
        .checkout-wrapper {
            margin: 80px auto; max-width: 500px; padding: 50px; background: rgba(10, 10, 10, 0.8);
            border-top: 1px solid #ff6600; border-bottom: 1px solid #ff6600; text-align: center;
        }
        .checkout-wrapper h2 { font-family: 'Syncopate', sans-serif; font-size: 22px; margin-bottom: 40px; letter-spacing: 2px; color: #ff6600; }
        .form-group { margin-bottom: 30px; }
        input, textarea {
            width: 100%; padding: 10px 0; background: transparent; border: none;
            border-bottom: 2px solid #333; color: #fff; font-family: 'Outfit', sans-serif; font-size: 16px; outline: none;
        }
        input:focus, textarea:focus { border-bottom-color: #ff6600; }
        .pay-btn {
            width: 100%; padding: 18px; background: #ff6600; color: #000; border: none;
            font-family: 'Syncopate', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 3px;
            cursor: pointer; transition: 0.4s; text-transform: uppercase; margin-top: 20px; border-radius: 5px;
        }
        .pay-btn:hover { background: #fff; box-shadow: 0 0 20px rgba(255,102,0,0.5); }
    </style>
</head>
<body>

    <!-- 1. SIGN IN / LOG IN SCREEN -->
    <div id="auth-screen">
        <div class="auth-box">
            <h1 id="auth-title">SIGN IN</h1>
            <input type="text" id="auth-name" class="auth-input" placeholder="Enter Your Name" required>
            <button class="enter-btn" id="enter-store-btn">ENTER THE DRIP</button>
        </div>
    </div>

    <!-- 2. MAIN STORE -->
    <div id="main-store">
        <!-- टॉप स्क्रॉलिंग पट्टी -->
        <div class="marquee-container">
            <div class="marquee-text">
                🔥 Z-VOLT DRIP IS LIVE • FREE SHIPPING ALL OVER INDIA • LIMITED EDITION • SECURE CHECKOUT 🔥
            </div>
        </div>

        <div id="stars"></div>

        <!-- हीरो सेक्शन (बैकग्राउंड में आपकी IMG_20260904_152818.png लगी है) -->
        <div class="hero">
            <h1>Z-VOLT</h1>
        </div>

        <!-- प्रोडक्ट सेक्शन -->
        <div class="product-container">
            <!-- PRODUCT CARD -->
            <div class="product-card">
                <div class="product-img-box">
                    <!-- यहाँ आपकी मेन T-Shirt की PNG है -->
                    <img class="product-img" src="IMG_20260904_152637.png" alt="Shock 1 T-Shirt">
                </div>
                <div class="product-title">SHOCK 1 LEGACY</div>
                <div class="product-price">₹ 599.00</div>
                
                <!-- एस्थेटिक साइज चार्ट बटन -->
                <button class="size-btn" onclick="toggleSize('size-chart-1')">
                    SIZE GUIDE <span>▼</span>
                </button>
                <!-- साइज चार्ट फोटो जो क्लिक करने पर ड्रॉपडाउन में खुलेगी -->
                <div class="size-chart-content" id="size-chart-1">
                    <!-- यहाँ आपकी साइज चार्ट वाली PNG है -->
                    <img src="Screenshot_2026_0902_195351.png" alt="Size Chart" class="size-chart-img">
                </div>
            </div>
        </div>

        <!-- 3. पेमेंट और आर्डर फॉर्म (100% UNTOUCHED - आपका पुराना Formspree और Razorpay) -->
        <div class="checkout-wrapper">
            <h2>FINAL CHECKOUT</h2>
            
            <form id="orderForm" action="https://formspree.io/f/YOUR_API_KEY" method="POST">
                <div class="form-group">
                    <input type="text" name="Name" id="name" placeholder="Full Name" required>
                </div>
                <div class="form-group">
                    <input type="tel" name="Phone" id="phone" placeholder="Mobile Number" required>
                </div>
                <div class="form-group">
                    <textarea name="Address" id="address" rows="2" placeholder="Complete Shipping Address" required></textarea>
                </div>
                
                <button type="button" id="payButton" class="pay-btn">Pay ₹599 & Confirm</button>
            </form>
        </div>
    </div>

    <!-- Razorpay Payment Gateway Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        // ---------------- ऑथेंटिकेशन (लॉगिन/साइन-इन) का लॉजिक ----------------
        const authScreen = document.getElementById('auth-screen');
        const mainStore = document.getElementById('main-store');
        const enterBtn = document.getElementById('enter-store-btn');
        const authTitle = document.getElementById('auth-title');
        const authNameInput = document.getElementById('auth-name');

        // चेक करना कि बंदा पहले आ चुका है या नहीं
        if (localStorage.getItem('zvolt_user_logged_in') === 'true') {
            authTitle.innerText = "WELCOME BACK";
            authNameInput.style.display = "none";
            enterBtn.innerText = "ENTER STORE";
        }

        enterBtn.addEventListener('click', () => {
            if(authNameInput.style.display !== "none" && authNameInput.value.trim() === "") {
                alert("Please enter your name to access the store.");
                return;
            }
            localStorage.setItem('zvolt_user_logged_in', 'true');
            authScreen.style.opacity = '0';
            setTimeout(() => {
                authScreen.style.display = 'none';
                mainStore.style.display = 'block';
            }, 800);
        });

        // ---------------- साइज चार्ट खोलने/बंद करने का लॉजिक ----------------
        function toggleSize(chartId) {
            const chart = document.getElementById(chartId);
            chart.classList.toggle('active');
        }

        // ---------------- बैकग्राउंड के रियलिस्टिक तारे ----------------
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 100; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            let size = Math.random() * 2 + 1; 
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.animationDuration = (Math.random() * 3 + 1.5) + 's';
            star.style.animationDelay = Math.random() * 2 + 's';
            starsContainer.appendChild(star);
        }

        // ---------------- RAZORPAY PAYMENT (UNTOUCHED) ----------------
        document.getElementById('payButton').onclick = function(e){
            let name = document.getElementById('name').value;
            let phone = document.getElementById('phone').value;
            let address = document.getElementById('address').value;
            
            if(name === "" || phone === "" || address === "") {
                alert("PLEASE FILL ALL DETAILS TO PROCEED.");
                return;
            }

            var options = {
                "key": "rzp_test_YOUR_KEY_HERE", 
                "amount": "59900", // ₹599
                "currency": "INR",
                "name": "Z-VOLT DRIP",
                "description": "Shock 1 Legacy",
                "theme": {
                    "color": "#ff6600"
                },
                "handler": function (response){
                    alert("PAYMENT SUCCESSFUL! ORDER CONFIRMED: " + response.razorpay_payment_id);
                    document.getElementById('orderForm').submit();
                }
            };
            var rzp1 = new Razorpay(options);
            rzp1.open();
        }
    </script>
</body>
</html>
